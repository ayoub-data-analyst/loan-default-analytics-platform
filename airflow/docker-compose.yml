services:

  postgres:
    image: postgres:16

    container_name: airflow_postgres

    restart: always

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  airflow-init:

    build:
      context: ..
      dockerfile: Dockerfile

    container_name: airflow_init

    depends_on:
      - postgres

    environment:

      AIRFLOW_UID: 50000
      AIRFLOW_HOME: /opt/airflow

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Ayoub
      --lastname admin
      --role Admin
      --email ayoubelouichouany0@gmail.com
      "

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ../:/opt/project
      - /home/ayoub/.dbt:/home/airflow/.dbt


  airflow-webserver:

    build:
      context: ..
      dockerfile: Dockerfile

    container_name: airflow_webserver

    restart: always

    depends_on:
      - postgres
      - airflow-init

    environment:

      AIRFLOW_UID: 50000
      AIRFLOW_HOME: /opt/airflow
      
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    command: webserver

    ports:
      - "8080:8080"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ../:/opt/project
      - /home/ayoub/.dbt:/home/airflow/.dbt


  airflow-scheduler:

    build:
      context: ..
      dockerfile: Dockerfile

    container_name: airflow_scheduler

    restart: always

    depends_on:
      - postgres
      - airflow-init

    environment:

      AIRFLOW_UID: 50000
      AIRFLOW_HOME: /opt/airflow
      
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    command: scheduler

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ../:/opt/project
      - /home/ayoub/.dbt:/home/airflow/.dbt

volumes:
  postgres_data: